[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "epson-projector-tools"
version = "0.1.0"
description = "Epson projector toolkit: emulator and interactive terminal for serial TCP, ESC/VP.net, and HTTP transports"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.80.0",
    "aiohttp>=3.9.0",
    "pyyaml>=6.0",
]

[project.scripts]
epson-emulator = "main:main"
epson-terminal = "terminal:main"

[tool.setuptools]
py-modules = ["terminal", "main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["projector*", "transports*", "ui*", "client*"]
